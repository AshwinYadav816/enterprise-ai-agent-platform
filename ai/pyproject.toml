[project]
name = "eap-ai"
version = "0.1.0"
description = "AI module (RAG, agents, orchestration) of the Enterprise AI Agent Platform"
authors = [
    { name = "AshwinYadav816", email = "ashwinyadavv911@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "fpdf2>=2.8.9",
    "langchain-core>=1.6.10",
    "langchain-mistralai>=1.1.6",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "markdown>=3.11.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.19.1",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
